// (bei 800 × 340), Block mit Unterzeile in Papier, 230 von 340 hoch.
function makeStickerCanvas() {
  var k = 2;
  var w = 800 * k;
  var h = 340 * k;
  var c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  var g = c.getContext('2d');
  var r = 16 * k;
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#042c1b';
  g.beginPath();
  g.moveTo(r, 0);
  g.lineTo(w - r, 0);
  g.quadraticCurveTo(w, 0, w, r);
  g.lineTo(w, h - r);
  g.quadraticCurveTo(w, h, w - r, h);
  g.lineTo(r, h);
  g.quadraticCurveTo(0, h, 0, h - r);
  g.lineTo(0, r);
  g.quadraticCurveTo(0, 0, r, 0);
  g.closePath();
  g.fill();
  var logoH = 230 * k;
  var s = logoH / OM_LOGO_VIEWBOX[3];
  var logoW = OM_LOGO_VIEWBOX[2] * s;
  g.save();
  g.translate((w - logoW) / 2, (h - logoH) / 2);
  g.scale(s, s);
  g.translate(-OM_LOGO_VIEWBOX[0], -OM_LOGO_VIEWBOX[1]);
  g.fillStyle = '#f6f7f4';
  g.fill(new Path2D(OM_LOGO_D));
  g.restore();
  return c;
}

// Riemenverlauf um zwei Scheiben (außen herum, gegen den Uhrzeigersinn):
// oben nach hinten, um die hintere Scheibe, unten nach vorn, um die vordere.
function beltLoop(c1, r1, c2, r2) {
  var dx = c2.x - c1.x;
  var dy = c2.y - c1.y;
  var d = Math.hypot(dx, dy);
  var base = Math.atan2(dy, dx);
  var a = Math.acos((r1 - r2) / d);
  var top = base - a;
  var bot = base + a;
  var pts = [];
  function line(p, q, n) {
    for (var i = 0; i < n; i++) {
      var t = i / n;
      pts.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
    }
  }
  function arc(c, r, from, to, n) {
    for (var i = 0; i < n; i++) {
      var t = from + ((to - from) * i) / n;
      pts.push([c.x + Math.cos(t) * r, c.y + Math.sin(t) * r]);
    }
  }
  var t1top = [c1.x + Math.cos(top) * r1, c1.y + Math.sin(top) * r1];
  var t2top = [c2.x + Math.cos(top) * r2, c2.y + Math.sin(top) * r2];
  var t2bot = [c2.x + Math.cos(bot) * r2, c2.y + Math.sin(bot) * r2];
  var t1bot = [c1.x + Math.cos(bot) * r1, c1.y + Math.sin(bot) * r1];
  line(t1top, t2top, 24);
  arc(c2, r2, top, bot, 28);
  line(t2bot, t1bot, 24);
  arc(c1, r1, bot, top + 2 * Math.PI, 40);
  return pts;
}

// Flacher Riemen: rechteckiger Querschnitt entlang einer geschlossenen Linie.
function beltGeometry(THREE, pts, z, w, th) {
  var n = pts.length;
  var q = [];
  for (var i = 0; i < n; i++) {
    var a = pts[(i - 1 + n) % n];
    var b = pts[(i + 1) % n];
    var tx = b[0] - a[0];
    var ty = b[1] - a[1];
    var l = Math.hypot(tx, ty) || 1;
    q.push([ty / l, -tx / l]);
  }
  var h = th / 2;
  var sides = [
    [[h, -w / 2], [h, w / 2], 'out'],
    [[-h, w / 2], [-h, -w / 2], 'in'],
    [[h, w / 2], [-h, w / 2], 'r'],
    [[-h, -w / 2], [h, -w / 2], 'l'],
  ];
  var pos = [];
  var nor = [];
  var idx = [];
  sides.forEach(function (side) {
    var start = pos.length / 3;
    for (var i = 0; i < n; i++) {
      var p = pts[i];
      var nn = q[i];
      [side[0], side[1]].forEach(function (c) {
        pos.push(p[0] + nn[0] * c[0], p[1] + nn[1] * c[0], z + c[1]);
        if (side[2] === 'out') nor.push(nn[0], nn[1], 0);
        else if (side[2] === 'in') nor.push(-nn[0], -nn[1], 0);
        else if (side[2] === 'r') nor.push(0, 0, 1);
        else nor.push(0, 0, -1);
      });
    }
    for (var j = 0; j < n; j++) {
      var k = (j + 1) % n;
      var a0 = start + j * 2;
      var a1 = start + j * 2 + 1;
      var b0 = start + k * 2;
      var b1 = start + k * 2 + 1;
      idx.push(a0, a1, b1, a0, b1, b0);
    }
  });
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setIndex(idx);
  return geo;
}

}

// Sanftes Studiolicht als Umgebung (für Glanz an Metallteilen).
function makeStudioEnvironment(THREE, renderer) {
  var scene = new THREE.Scene();
  var geo = new THREE.SphereGeometry(10, 32, 16);
  var col = [];
  var pos = geo.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    var y = pos.getY(i) / 10;
    var v = y > 0 ? 0.92 + 0.08 * y : 0.78 + 0.14 * (1 + y);
    col.push(v, v, v);
  }

  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  function softbox(w, h, p, intensity) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.setScalar(intensity);
    m.position.copy(p);
    m.lookAt(0, 0, 0);
    scene.add(m);
  }
  softbox(6, 3, new THREE.Vector3(3, 6, 4), 3);
  softbox(4, 4, new THREE.Vector3(-6, 3, -2), 1.6);
  softbox(5, 2, new THREE.Vector3(0, 4, -6), 1.4);
  var pm = new THREE.PMREMGenerator(renderer);
  var env = pm.fromScene(scene, 0.04).texture;
  pm.dispose();
  scene.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  return env;
}

// Weicher Boden unter dem Rad.
function makeFloor(THREE) {
  var c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  var g = c.getContext('2d');
  var grd = g.createRadialGradient(256, 256, 4, 256, 256, 252);
  grd.addColorStop(0, 'rgba(20,24,27,0.13)');
  grd.addColorStop(0.5, 'rgba(20,24,27,0.06)');
  grd.addColorStop(1, 'rgba(20,24,27,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 512, 512);
  var tex = new THREE.CanvasTexture(c);
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(3.3, 1.3),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(0.0, 0.0005, 0);
  m.renderOrder = -1;
  return m;
}

// ---------------------------------------------------------------------------
// Betrachter: Kamera um das Rad, Antippen wählt ein Bauteil, Stecknadeln für
// markierte Stellen. Rendert nur, wenn sich etwas ändert.
// ---------------------------------------------------------------------------

var DEG = Math.PI / 180;
var BIKE_CENTER = [0.0, 0.53, 0];
var VIEW_PRESETS = [
  { id: 'schraeg', label: 'Schräg', theta: 38, phi: 70 },
  { id: 'rechts', label: 'Rechts', theta: 0, phi: 84 },
  { id: 'links', label: 'Links', theta: 180, phi: 84 },
  { id: 'vorne', label: 'Vorne', theta: 90, phi: 76 },
  { id: 'hinten', label: 'Hinten', theta: -90, phi: 72 },
];
var PIN_COLORS = {
  problem: { fill: '#b3261e', ink: '#ffffff' },
  beobachten: { fill: '#f0b43c', ink: '#2a1e00' },
  neu: { fill: '#004429', ink: '#ffffff' },
};

function lrClamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function lrFitRadius(aspect) {
  var t = Math.tan(15 * DEG);
  return 1.12 * Math.max(1.27 / (t * aspect), 0.74 / t);
}

// Stecknadel: weißer Rand, farbige Fläche (Problem rund, Beobachten eckig),
// Nummer in der Mitte. Unten die Spitze, die auf die Stelle zeigt.
function lrPinCanvas(label, kind, active) {
  var w = 128;
  var h = 160;
  var c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  var g = c.getContext('2d');
  var cx = 64;
  var cy = 62;
  var r = 44;
  var col = PIN_COLORS[kind] || PIN_COLORS.neu;
  if (active) {
    g.fillStyle = '#004429';
    g.beginPath();
    g.arc(cx, cy, r + 14, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = '#ffffff';
  g.beginPath();
  g.moveTo(cx - 20, cy + 34);
  g.lineTo(cx, h - 2);
  g.lineTo(cx + 20, cy + 34);
  g.closePath();
  g.fill();
  g.beginPath();
  g.arc(cx, cy, r + 7, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = col.fill;
  g.beginPath();
  if (kind === 'beobachten') {
    var s = r * 0.86;
    var k = 14;
    g.moveTo(cx - s + k, cy - s);
    g.lineTo(cx + s - k, cy - s);
    g.quadraticCurveTo(cx + s, cy - s, cx + s, cy - s + k);
    g.lineTo(cx + s, cy + s - k);
    g.quadraticCurveTo(cx + s, cy + s, cx + s - k, cy + s);
    g.lineTo(cx - s + k, cy + s);
    g.quadraticCurveTo(cx - s, cy + s, cx - s, cy + s - k);
    g.lineTo(cx - s, cy - s + k);
    g.quadraticCurveTo(cx - s, cy - s, cx - s + k, cy - s);
  } else {
    g.arc(cx, cy, r, 0, Math.PI * 2);
  }
  g.fill();
  g.fillStyle = col.ink;
  g.font = '800 50px "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(label, cx, cy + 3);
  return c;
}

function LrViewer(canvas, opts) {
  this.canvas = canvas;
  this.opts = opts || {};
  this.markers = [];
  this.draft = null;
  this.activeId = null;
  this.highlight = [];
  this.hover = null;
  this.hoverAt = null;
  this.anim = null;
  this.dirty = true;
  this.disposed = false;
  this.pointers = new Map();
  this.press = null;
  this.pinch = null;
  this.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

LrViewer.prototype.init = function (THREE) {
  var self = this;
  this.THREE = THREE;
  THREE.ColorManagement.legacyMode = false;
  var renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: false, powerPreference: 'low-power' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(this.opts.background || 0xf4f5f7, 1);
  this.renderer = renderer;
  var scene = new THREE.Scene();
  scene.environment = makeStudioEnvironment(THREE, renderer);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe2e5, 0.35));
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(2, 4, 3);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.3);
  fill.position.set(-3, 2, -2);
  scene.add(fill);
  this.bike = buildCargoBike(THREE, { anisotropy: renderer.capabilities.getMaxAnisotropy() });
  scene.add(this.bike.root);
  scene.add(makeFloor(THREE));
  this.pins = new THREE.Group();
  scene.add(this.pins);
  this.scene = scene;
  this.camera = new THREE.PerspectiveCamera(30, 1, 0.03, 60);
  this.raycaster = new THREE.Raycaster();
  this.pickables = [];
  this.bike.root.traverse(function (o) {
    if (o.isMesh && o.userData.zone) self.pickables.push(o);
  });
  var v = VIEW_PRESETS[0];
  this.orbit = {
    theta: v.theta * DEG,
    phi: v.phi * DEG,
    radius: 4,
    target: new THREE.Vector3(BIKE_CENTER[0], BIKE_CENTER[1], BIKE_CENTER[2]),
    auto: true,
  };
  this.size = { w: 0, h: 0 };
  this.resize();

  this.on = {
    down: function (e) {
      self.onDown(e);
    },
    move: function (e) {
      self.onMove(e);
    },
    up: function (e) {
      self.onUp(e);
    },
    cancel: function (e) {
      self.onCancel(e);
    },
    leave: function (e) {
      if (e.pointerType === 'mouse' && !self.pointers.size) self.setHover(null);
    },
    wheel: function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      self.zoomBy(Math.exp(e.deltaY * 0.0025));
    },
  };
  var cv = this.canvas;
  cv.addEventListener('pointerdown', this.on.down);
  cv.addEventListener('pointermove', this.on.move);
  cv.addEventListener('pointerup', this.on.up);
  cv.addEventListener('pointercancel', this.on.cancel);
  cv.addEventListener('pointerleave', this.on.leave);
  cv.addEventListener('wheel', this.on.wheel, { passive: false });
  if (window.ResizeObserver) {
    this.ro = new ResizeObserver(function () {
      self.resize();
    });
    this.ro.observe(cv);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      if (!self.disposed) self.buildPins();
    });
  }
  this.loop = this.loop.bind(this);
  this.raf = requestAnimationFrame(this.loop);
};

LrViewer.prototype.aspect = function () {
  return this.size.w / Math.max(1, this.size.h);
};

LrViewer.prototype.resize = function () {
  var w = Math.max(1, this.canvas.clientWidth);
  var h = Math.max(1, this.canvas.clientHeight);
  if (w === this.size.w && h === this.size.h) return;
  this.size = { w: w, h: h };
  this.renderer.setSize(w, h, false);
  this.camera.aspect = w / h;
  this.camera.updateProjectionMatrix();
  if (this.orbit.auto) this.orbit.radius = lrFitRadius(w / h);
  this.scalePins();
  this.dirty = true;
};

LrViewer.prototype.loop = function () {
  if (this.disposed) return;
  this.raf = requestAnimationFrame(this.loop);
  var now = performance.now();
  var busy = false;
  if (this.anim) {
    var a = this.anim;
    var k = a.ms > 0 ? lrClamp((now - a.t0) / a.ms, 0, 1) : 1;
    var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    var o = this.orbit;
    o.theta = a.from.theta + (a.to.theta - a.from.theta) * e;
    o.phi = a.from.phi + (a.to.phi - a.from.phi) * e;
    o.radius = a.from.radius + (a.to.radius - a.from.radius) * e;
    o.target.lerpVectors(a.from.target, a.to.target, e);
    if (k >= 1) this.anim = null;
    busy = true;
  }
  if (this.hoverAt) {
    var at = this.hoverAt;
    this.hoverAt = null;
    var hit = this.raycast(at.x, at.y);
    this.setHover(hit && !hit.markerId ? hit.zone : null);
  }
  var pulsing = this.highlight.length > 0 && !this.reduced;
  if (pulsing || this.glowDirty) {
    this.applyGlow(now);
    this.glowDirty = false;
    busy = true;
  }
  if (this.dirty || busy) {
    var ob = this.orbit;
    var sp = Math.sin(ob.phi);
    this.camera.position.set(
      ob.target.x + ob.radius * sp * Math.sin(ob.theta),
      ob.target.y + ob.radius * Math.cos(ob.phi),
      ob.target.z + ob.radius * sp * Math.cos(ob.theta)
    );
    this.camera.lookAt(ob.target);
    this.renderer.render(this.scene, this.camera);
    this.dirty = false;
  }
};

LrViewer.prototype.applyGlow = function (now) {
  var hl = {};
  this.highlight.forEach(function (z) {
    hl[z] = true;
  });
  var pulse = this.reduced ? 0.6 : 0.42 + 0.3 * (0.5 + 0.5 * Math.sin(now / 260));
  var hover = this.hover;
  var zones = this.bike.zones;
  Object.keys(zones).forEach(function (id) {
    var mode = hl[id] ? 'sel' : hover === id ? 'hover' : null;
    zones[id].materials.forEach(function (m) {
      if (m.map) return;
      if (mode === 'sel') {
        m.emissive.setHex(0x1f9d63);
        m.emissiveIntensity = pulse;
      } else if (mode === 'hover') {
        m.emissive.setHex(0x2a8a5c);
        m.emissiveIntensity = 0.3;
      } else {
        m.emissive.copy(m.userData.baseEmissive);
        m.emissiveIntensity = m.userData.baseEmissiveIntensity;
      }
    });
  });
};

LrViewer.prototype.setHover = function (zone) {
  if (zone === this.hover) return;
  this.hover = zone;
  this.glowDirty = true;
  this.canvas.style.cursor = zone ? 'pointer' : 'grab';
  if (this.opts.onHover) this.opts.onHover(zone);
};

LrViewer.prototype.setHighlight = function (zones) {
  this.highlight = (zones || []).filter(Boolean);
  this.glowDirty = true;
};

LrViewer.prototype.raycast = function (x, y) {
  var THREE = this.THREE;
  var rect = this.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  var ndc = new THREE.Vector2(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
  this.raycaster.setFromCamera(ndc, this.camera);
  var ph = this.raycaster.intersectObjects(this.pins.children, false);
  for (var i = 0; i < ph.length; i++) {
    var u = ph[i].object.userData;
    if (u.markerId) return { zone: u.zone, markerId: u.markerId, point: u.point };
  }
  var hits = this.raycaster.intersectObjects(this.pickables, false);
  for (var j = 0; j < hits.length; j++) {
    var z = hits[j].object.userData.zone;
    if (z) {
      var p = hits[j].point;
      return { zone: z, point: [Math.round(p.x * 1000) / 1000, Math.round(p.y * 1000) / 1000, Math.round(p.z * 1000) / 1000] };
    }
  }
  return null;
};

LrViewer.prototype.onDown = function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try {
    this.canvas.setPointerCapture(e.pointerId);
  } catch (err) {
    /* ohne Capture geht es auch */
  }
  this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (this.pointers.size === 1) {
    this.press = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  } else if (this.pointers.size === 2) {
    this.press = null;
    this.pinch = { d: this.pinchDistance(), r: this.orbit.radius };
  }
  this.anim = null;
  this.canvas.style.cursor = 'grabbing';
  e.preventDefault();
};

LrViewer.prototype.pinchDistance = function () {
  var pts = Array.from(this.pointers.values());
  if (pts.length < 2) return 1;
  return Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
};

LrViewer.prototype.onMove = function (e) {
  if (!this.pointers.has(e.pointerId)) {
    if (e.pointerType === 'mouse') this.hoverAt = { x: e.clientX, y: e.clientY };
    return;
  }
  var p = this.pointers.get(e.pointerId);
  var dx = e.clientX - p.x;
  var dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (this.pointers.size === 1) {
    if (this.press) this.press.moved += Math.abs(dx) + Math.abs(dy);
    if (!this.press || this.press.moved > 5) {
      this.orbit.theta -= dx * 0.009;
      this.orbit.phi = lrClamp(this.orbit.phi - dy * 0.007, 0.18, 1.54);
      this.dirty = true;
      if (this.opts.onViewChange) this.opts.onViewChange(null);
    }
  } else if (this.pointers.size === 2 && this.pinch) {
    var fit = lrFitRadius(this.aspect());
    this.orbit.radius = lrClamp((this.pinch.r * this.pinch.d) / this.pinchDistance(), 0.55, fit * 1.6);
    this.orbit.auto = false;
    this.dirty = true;
  }
};

LrViewer.prototype.onUp = function (e) {
  var pr = this.press;
  var tap = pr && pr.id === e.pointerId && pr.moved <= 6 && performance.now() - pr.t < 700;
  this.pointers.delete(e.pointerId);
  if (this.pointers.size < 2) this.pinch = null;
  this.press = null;
  this.canvas.style.cursor = this.hover ? 'pointer' : 'grab';
  if (tap) {
    var hit = this.raycast(e.clientX, e.clientY);
    if (this.opts.onPick) this.opts.onPick(hit);
  }
};

LrViewer.prototype.onCancel = function (e) {
  this.pointers.delete(e.pointerId);
  this.press = null;
  this.pinch = null;
};

LrViewer.prototype.flyTo = function (theta, phi, radius, target, ms) {
  var o = this.orbit;
  var d = theta - o.theta;
  d = ((((d + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
  this.anim = {
    t0: performance.now(),
    ms: this.reduced ? 0 : ms,
    from: { theta: o.theta, phi: o.phi, radius: o.radius, target: o.target.clone() },
    to: { theta: o.theta + d, phi: phi, radius: radius, target: target.clone() },
  };
};

LrViewer.prototype.setView = function (id) {
  var v = VIEW_PRESETS.filter(function (p) {
    return p.id === id;
  })[0];
  if (!v) return;
  this.orbit.auto = true;
  var THREE = this.THREE;
  this.flyTo(v.theta * DEG, v.phi * DEG, lrFitRadius(this.aspect()), new THREE.Vector3(BIKE_CENTER[0], BIKE_CENTER[1], BIKE_CENTER[2]), 650);
};

LrViewer.prototype.focusZones = function (ids, view) {
  var THREE = this.THREE;
  var zones = this.bike.zones;
  var box = new THREE.Box3();
  (ids || []).forEach(function (id) {
    if (zones[id] && zones[id].box) box.union(zones[id].box);
  });
  if (box.isEmpty()) return;
  var c = box.getCenter(new THREE.Vector3());
  var v = view || (ids.length === 1 && BIKE_ZONES[ids[0]] ? BIKE_ZONES[ids[0]].view : [20, 80, null]);
  var a = this.aspect();
  var r = v[2] ? v[2] * Math.max(1, 1.35 / a) : lrFitRadius(a) * 0.95;
  this.orbit.auto = false;
  this.flyTo(v[0] * DEG, v[1] * DEG, r, c, 700);
};

LrViewer.prototype.zoomBy = function (f) {
  var fit = lrFitRadius(this.aspect());
  this.anim = null;
  this.orbit.radius = lrClamp(this.orbit.radius * f, 0.55, fit * 1.6);
  this.orbit.auto = false;
  this.dirty = true;
};

LrViewer.prototype.zoneCenter = function (zone) {
  var z = this.bike.zones[zone];
  return z && z.center ? [z.center.x, z.center.y, z.center.z] : null;
};

// markers: [{ id, zone, point, severity }], draft: { zone, point } für eine
// neue Stelle, activeId: die Stelle, die gerade bearbeitet wird.
LrViewer.prototype.setMarkers = function (markers, draft, activeId) {
  this.markers = markers || [];
  this.draft = draft || null;
  this.activeId = activeId || null;
  this.buildPins();
};

LrViewer.prototype.buildPins = function () {
  var THREE = this.THREE;
  var self = this;
  this.pins.children.slice().forEach(function (s) {
    self.pins.remove(s);
    s.material.map.dispose();
    s.material.dispose();
  });
  function pin(label, kind, active, point, data, order) {
    var tex = new THREE.CanvasTexture(lrPinCanvas(label, kind, active));
    tex.encoding = THREE.sRGBEncoding;
    var mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true });
    var s = new THREE.Sprite(mat);
    s.center.set(0.5, 0.0);
    s.position.set(point[0], point[1], point[2]);
    s.renderOrder = 100 + order;
    s.userData = data;
    s.userData.px = active ? 40 : 32;
    self.pins.add(s);
  }
  this.markers.forEach(function (m, i) {
    var point = m.point || self.zoneCenter(m.zone);
    if (!point) return;
    var active = m.id === self.activeId;
    pin(String(i + 1), m.severity, active, point, { markerId: m.id, zone: m.zone, point: point }, active ? 90 : i);
  });
  if (this.draft && this.draft.zone) {
    var dp = this.draft.point || this.zoneCenter(this.draft.zone);
    if (dp) pin(String(this.markers.length + 1), 'neu', true, dp, { zone: this.draft.zone, point: dp }, 95);
  }
  this.scalePins();
  this.dirty = true;
};

LrViewer.prototype.scalePins = function () {
  var h = Math.max(1, this.size.h);
  var t = Math.tan((this.camera.fov * DEG) / 2);
  this.pins.children.forEach(function (s) {
    var sy = (s.userData.px * 1.25 * 2 * t) / h;
    s.scale.set(sy / 1.25, sy, 1);
  });
};

LrViewer.prototype.dispose = function () {
  this.disposed = true;
  cancelAnimationFrame(this.raf);
  if (this.ro) this.ro.disconnect();
  var cv = this.canvas;
  if (this.on) {
    cv.removeEventListener('pointerdown', this.on.down);
    cv.removeEventListener('pointermove', this.on.move);
    cv.removeEventListener('pointerup', this.on.up);
    cv.removeEventListener('pointercancel', this.on.cancel);
    cv.removeEventListener('pointerleave', this.on.leave);
    cv.removeEventListener('wheel', this.on.wheel);
  }
  if (this.scene) {
    this.scene.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        [].concat(o.material).forEach(function (m) {
          if (m.map) m.map.dispose();
          m.dispose();
        });
      }
    });
    if (this.scene.environment) this.scene.environment.dispose();
  }
  if (this.renderer) {
    this.renderer.dispose();
    if (this.renderer.forceContextLoss) this.renderer.forceContextLoss();
  }
};

// ---------------------------------------------------------------------------
// Baustein: allein ein Schaufenster für das Modell, eingebunden im Check-Up,
// in der Pannenmeldung und im Verlauf meldet er jedes Antippen über onPick.
// ---------------------------------------------------------------------------

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var self = this;
    this.state = { view: 'schraeg', hover: null, selected: null, failed: false };
    this.viewer = null;
    this.canvasEl = null;
    this.tries = 0;
    this.synced = {};
    this.setCanvas = function (el) {
      if (el === self.canvasEl) return;
      self.teardown();
      self.canvasEl = el || null;
      if (el) self.tryInit();
    };
    this.viewPick = {};
    VIEW_PRESETS.forEach(function (v) {
      self.viewPick[v.id] = function () {
        if (self.viewer) self.viewer.setView(v.id);
        self.setState({ view: v.id });
      };
    });
    this.zoomIn = function () {
      if (self.viewer) self.viewer.zoomBy(0.8);
    };
    this.zoomOut = function () {
      if (self.viewer) self.viewer.zoomBy(1.25);
    };
  }

  componentDidMount() {
    this.tryInit();
  }

  componentDidUpdate() {
    this.sync();
  }

  componentWillUnmount() {
    this.teardown();
    this.canvasEl = null;
  }

  tryInit() {
    var self = this;
    if (this.viewer || !this.canvasEl || this.state.failed) return;
    if (!window.THREE) {
      clearTimeout(this.retry);
      if (this.tries++ < 80) {
        this.retry = setTimeout(function () {
          self.tryInit();
        }, 125);
      } else {
        this.setState({ failed: true });
      }
      return;
    }
    try {
      var viewer = new LrViewer(this.canvasEl, {
        onPick: function (hit) {
          self.handlePick(hit);
        },
        onHover: function (zone) {
          if (self.state.hover !== zone) self.setState({ hover: zone });
        },
        onViewChange: function (id) {
          if (self.state.view !== id) self.setState({ view: id });
        },
      });
      viewer.init(window.THREE);
      this.viewer = viewer;
      this.synced = {};
      this.sync();
    } catch (err) {
      console.error(err);
      this.setState({ failed: true });
    }
  }

  teardown() {
    clearTimeout(this.retry);
    if (this.viewer) {
      this.viewer.dispose();
      this.viewer = null;
    }
  }

  standalone() {
    return typeof this.props.onPick !== 'function';
  }

  handlePick(hit) {
    if (!this.standalone()) {
      this.props.onPick(hit);
      return;
    }
    this.setState({ selected: hit ? hit.zone : null });
  }

  sync() {
    var v = this.viewer;
    if (!v) return;
    var p = this.props;
    var markers = Array.isArray(p.markers) ? p.markers : [];
    var draft = p.draft && p.draft.zone ? p.draft : null;
    var mk = JSON.stringify([markers, draft, p.activeMarker || null]);
    if (mk !== this.synced.markers) {
      this.synced.markers = mk;
      v.setMarkers(markers, draft, p.activeMarker || null);
    }
    var hl = Array.isArray(p.highlight) ? p.highlight.slice() : [];
    if (this.standalone() && this.state.selected) hl.push(this.state.selected);
    var hk = hl.join(',');
    if (hk !== this.synced.highlight) {
      this.synced.highlight = hk;
      v.setHighlight(hl);
    }
    var f = p.focus;
    var fk = f && f.token != null ? String(f.token) : '';
    if (fk !== this.synced.focus) {
      this.synced.focus = fk;
      if (fk && f.zones && f.zones.length) {
        v.focusZones(f.zones, f.view || null);
        if (this.state.view !== null) this.setState({ view: null });
      }
    }
  }

  renderVals() {
    var self = this;
    var p = this.props;
    var zone = this.state.hover || (this.standalone() ? this.state.selected : null);
    var info = zone ? BIKE_ZONES[zone] : null;
    var text = info
      ? info.label + ' · ' + (info.check ? 'Prüfpunkt „' + info.check + '“' : 'kein eigener Prüfpunkt')
      : p.hint || 'Ziehen dreht das Rad · Antippen wählt ein Bauteil';
    var markers = Array.isArray(p.markers) ? p.markers : [];
    var count = markers.length === 1 ? 'Eine Stelle markiert.' : markers.length ? markers.length + ' Stellen markiert.' : 'Keine Stelle markiert.';
    return {
      setCanvas: this.setCanvas,
      height: Number(p.height) || 640,
      infoText: text,
      infoBg: info ? '#042c1b' : 'rgba(255,255,255,0.94)',
      infoFg: info ? '#f6f7f4' : '#5a6169',
      canvasLabel: '3D-Modell des Lastenrads Load 60 mit Riemen und Transportbox. ' + count,
      views: VIEW_PRESETS.map(function (v) {
        var on = self.state.view === v.id;
        return {
          id: v.id,
          label: v.label,
          pick: self.viewPick[v.id],
          pressed: on ? 'true' : 'false',
          bg: on ? '#004429' : 'transparent',
          fg: on ? '#ffffff' : '#14181b',
        };
      }),
      zoomIn: this.zoomIn,
      zoomOut: this.zoomOut,
      failed: this.state.failed,
    };
  }
}
</script>
</body>
</html>
