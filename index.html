<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Marke Own Motion. Die Dateien unter /marke/ sind byte-gleiche Kopien
         aus marke/app/ und marke/logo/ - marke/README.md bleibt die einzige
         Quelle, src/marke.test.ts haelt die Gleichheit fest. Absolute Pfade
         statt eines Imports: Browser und Betriebssysteme holen Symbole ueber
         feste Adressen, ein gehashter Bundle-Name traegt das nicht. -->
    <!-- Kleinformat ist das Monogramm, nicht die Wortmarke: zweizeilig war sie
         im Tab unlesbar (marke/README.md, Befund 2, entschieden 2026-09-11).
         SVG zuerst - wo der Browser es nimmt, skaliert das Symbol auf jeder
         Bildschirmdichte sauber; die drei PNG bleiben als Rueckfall. -->
    <!-- Die Schrift liegt auf dem kritischen Pfad jedes ersten Aufrufs: Ohne
         Preload fragt der Browser sie erst an, wenn er das CSS gelesen hat
         (R3-034). crossorigin ist bei Schriften Pflicht - ohne das Attribut
         laedt der Browser die Datei ein zweites Mal. -->
    <link
      rel="preload"
      href="/schrift/HankenGrotesk-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/marke/own-motion-monogramm.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/marke/own-motion-monogramm-48.png" />
    <link rel="icon" type="image/png" sizes="24x24" href="/marke/own-motion-monogramm-24.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/marke/own-motion-monogramm-16.png" />
    <!-- Das quadratische Master, nicht die iOS-gerundete Fassung: iOS legt
         seine eigene Maske darueber, ein vorgerundetes Symbol wird zweimal
         beschnitten. -->
    <link rel="apple-touch-icon" href="/marke/own-motion-app-1024.png" />
    <!-- Android legt ein rechteckiges Symbol ohne Manifest verkleinert in einen
         weissen Kreis (BEF-040). Das Manifest nennt dasselbe Master als
         "maskable": Es ist vollflaechig Tiefgruen, die Wortmarke liegt im
         Schutzkreis - keine zweite Datei (marke/README.md). display "browser"
         aendert am Oeffnen nichts, einen Service Worker gibt es nicht
         (ADR-015 Punkt 16, ANN-110). use-credentials, weil der Browser das
         Manifest sonst ohne die Anmeldung der zweiten Tuer der
         Test-Umgebung holt (ANN-101). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <title>Own Motion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
