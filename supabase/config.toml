# Supabase-Konfiguration fuer die LOKALE Entwicklung.
#
# ADR-015: In diesem Stand existiert bewusst kein Remote-/Produktionsprojekt.
# Ein spaeteres Cloudprojekt mit personenbezogenen Daten MUSS eine explizit
# freigegebene EU-Region verwenden (Kandidat: Frankfurt eu-central-1) und
# setzt die dokumentierte Providerpruefung nach ADR-002 voraus.

project_id = "praxissoftware-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
# Aktuelle Supabase-CLI-Versionen bieten fuer den lokalen lauffaehigen
# Postgres-Container kein Major-Version-Image 16 mehr an (nur noch 15/17);
# ohne dies bricht `supabase start` mit "Invalid db.major_version: 16" ab.
# Betrifft ausschliesslich diesen Docker-Stack (Auth/Storage/Studio), nicht
# die Migrations-/RLS-Tests aus `pnpm test:db` gegen echtes PostgreSQL 16.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Lokaler Mailfaenger. Es werden keine echten Mails versendet.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# Jedes Ziel, das in einer Auth-Mail vorkommen darf, steht hier - sonst faellt
# GoTrue stillschweigend auf site_url zurueck und der Link landet wieder auf
# der Anmeldemaske. /kennwort-neu ist die oeffentliche Seite, die einen
# Wiederherstellungslink einloest (FIX-001, ANN-043).
# ACHTUNG: Dieselben Eintraege muessen im spaeteren Cloudprojekt unter
# Authentication > URL Configuration stehen, sonst laufen lokal und produktiv
# auseinander (OPS-001).
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/kennwort-neu",
  "http://127.0.0.1:5173/zugang",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Keine Selbstregistrierung: Accounts werden von der Praxis angelegt
# (PROJECT_PRINCIPLES.md 4.2 - individuelles Benutzerkonto ist Pflicht,
# aber nicht selbst vergeben).
enable_signup = false
enable_anonymous_sign_ins = false
# Mindestlaenge des Kennworts (ANN-027, R3-013). Ohne diesen Eintrag gilt der
# GoTrue-Standard von sechs Zeichen, und die Zwoelf aus dem Formular haetten
# nur auf dem Weg durch genau dieses Formular gegolten - nicht beim
# Wiederherstellungslink und nicht an der API vorbei. Laenge statt
# Zeichenklassen: das ist die Empfehlung von BSI und NIST, deshalb bleibt
# password_requirements ungesetzt.
# ACHTUNG: Dieselbe Zahl muss im spaeteren Cloudprojekt unter Authentication >
# Policies stehen, sonst laufen lokal und produktiv auseinander (OPS-001).
minimum_password_length = 12

[auth.email]
# ANN-043 (Fassung 2): Der Einmal-Code aus einer Auth-Mail gilt eine Stunde,
# ausdruecklich gesetzt statt dem Standard ueberlassen. Dieselbe Zahl gehoert
# im Cloudprojekt unter Authentication > Providers > Email (OPS-001).
otp_expiry = 3600
# ACHTUNG: In aktuellen Supabase-CLI-Versionen schaltet dieses Feld nicht
# mehr nur die Selbstregistrierung ab, sondern den gesamten E-Mail/
# Passwort-Provider (GOTRUE_EXTERNAL_EMAIL_ENABLED) - bei false lehnt
# GoTrue auch normale Anmeldungen mit 422 "Email logins are disabled" ab.
# Die Selbstregistrierung bleibt trotzdem gesperrt, das steuert weiterhin
# das uebergeordnete [auth].enable_signup = false oben
# (PROJECT_PRINCIPLES.md 4.2 - keine Selbstregistrierung).
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
# SEC-EPIC-001 (ANN-257, Zweitreview): Ein Kennwortwechsel verlangt eine
# frische Anmeldung (juenger als 24 Stunden) oder einen Bestaetigungscode.
# Sonst koennte ein gesperrtes Token das Kennwort neu setzen und sich damit
# selbst freigeben. Dieselbe Einstellung gehoert im Cloudprojekt unter
# Authentication > Providers > Email ("Secure password change", OPS-001).
secure_password_change = true

# Eigene Vorlage fuer "Kennwort zuruecksetzen" (FIX-001, ANN-043). Die
# Begruendung steht vollstaendig in der Datei selbst: Der Link uebergibt nur
# den TokenHash, nicht eine fertige Sitzung im Adressfragment.
# Im Cloudprojekt liegt dieselbe Vorlage unter Authentication > Email
# Templates > Reset Password - config.toml wirkt dort nicht.
[auth.email.template.recovery]
subject = "Neues Kennwort setzen"
content_path = "./supabase/templates/recovery.html"

# ABN-012 (BEF-118, ANN-218): Mail-Hook des Anmeldedienstes. Eingeschaltet
# verschickt der Anmeldedienst seine Mails ueber den Zugangsdienst, und der
# schickt einem Plattformkonto ohne per Link bestaetigtes Postfach keinen
# Wiederherstellungslink. Bewusst AUS: Er braucht die Edge Runtime und den
# Versanddienst aus B13 - beides schaltet OPS-001 ein, im Cloudprojekt unter
# Authentication > Hooks > Send Email (config.toml wirkt dort nicht).
# [auth.hook.send_email]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/platform-access"
# secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# Zugangsmail an eine offene Einladung (FIX-002, ANN-043), gleiche Bauart.
# Im Cloudprojekt: Authentication > Email Templates > Magic Link.
[auth.email.template.magic_link]
subject = "Anmeldemail für die Praxisanwendung"
content_path = "./supabase/templates/magic_link.html"

# Edge Functions sind NICHT fuer produktive Gesundheitsdaten freigegeben
# (ADR-015). Lokal deaktiviert, damit nichts unbemerkt entsteht.
#
# Das bleibt auch mit MAP-003 so: Der Routing-Adapter (location-provider) ist
# gebaut, aber die Laufzeit startet nicht von allein mit. Wer den Prototyp
# lokal fahren will, schaltet sie fuer den Lauf bewusst ein - der Weg steht in
# docs/sichtung/kartendienst.md. Freigegeben ist damit nichts: ADR-019
# Punkt 15 laesst den Datenweg nur mit synthetischen Koordinaten laufen, bis
# die Pruefung der Edge Runtime aus OPS-001 vorliegt.
[edge_runtime]
enabled = false

# Der Routing-Adapter aus MAP-003a. `verify_jwt` ist der Riegel der Plattform;
# die Function prueft die Sitzung zusaetzlich selbst (sitzung.ts). Zwei
# Riegel, nicht einer statt des anderen.
[functions.location-provider]
verify_jwt = true

# Der Zugangsdienst der Plattform (POR-003, ADR-023 Punkt 9). `verify_jwt`
# ist hier aus, weil die eingeladene Person beim Einloesen noch kein Konto hat:
# Die Berechtigung ist der einmalige Code, den die Datenbank prueft. Der
# Versand prueft die Sitzung der einladenden Person selbst ueber die
# Datenbank. Den Admin-Schluessel liest die Function nur aus dem eigens zu
# setzenden Secret PLATFORM_ACCESS_ADMIN_KEY; ohne ihn antwortet sie "nicht
# eingerichtet". Scharf erst nach OPS-001 (ADR-015 Punkt 20).
[functions.platform-access]
verify_jwt = false

# Die Pruefung am Inhalt (ABN-025, ADR-017 Punkte 49 bis 52). `verify_jwt`
# ist an: Ausgeloest wird sie von der hochladenden Person; die Function
# prueft die Sitzung zusaetzlich selbst und findet nur Dateien ihrer
# Organisation. Den Dienstschluessel liest sie nur aus dem eigens zu setzenden
# Secret PATIENT_FILE_VERIFY_SERVICE_KEY; ohne ihn antwortet sie "nicht
# eingerichtet". Scharf erst nach OPS-001 (ADR-015 Punkt 20), zusammen mit
# app.patient_file_verification_required().
[functions.patient-file-verify]
verify_jwt = true

[analytics]
enabled = false
