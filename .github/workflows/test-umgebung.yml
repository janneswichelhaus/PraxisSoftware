# =============================================================================
# Auslieferung in die Test-Umgebung (OPS-002a).
#
# Nach gruener CI auf `main` - und nur dann - bekommt die Test-Umgebung den
# geprueften Commit: Migrationen ins Supabase-Testprojekt, die gebaute
# Oberflaeche per rsync zu Uberspace. Nur synthetische Daten (PROJECT_PRINCIPLES
# 3.1), kein Produktivprojekt (3.2). Die Produktion bleibt G5 vorbehalten, mit
# menschlicher Freigabe (ADR-013 Punkt 6); dieser Workflow kennt keine.
#
# Secrets liegen allein in der GitHub-Umgebung `test`
# (docs/decisions/hosting-optionen.md, Schritt 2d). Fehlt eines der sieben
# Pflicht-Secrets, wird die Auslieferung uebersprungen statt rot.
#
# Seed und Praxiswoche loeschen alles in der Test-Umgebung. Sie laufen deshalb
# nur auf Knopfdruck (Handstart mit "neu aufsetzen") und beim allerersten Lauf
# gegen ein leeres Projekt (ANN-100).
# =============================================================================
name: Test-Umgebung

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      neu_aufsetzen:
        description: 'Seed und Praxiswoche neu einspielen - verwirft alles in der Test-Umgebung'
        type: boolean
        default: false

# Nie zwei Auslieferungen zugleich, und keine bricht die andere ab: Eine
# halb eingespielte Migration waere schlimmer als eine Minute Warten.
concurrency:
  group: test-umgebung
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ausliefern:
    name: Ausliefern
    # Automatisch nur nach einem gruenen CI-Lauf fuer einen Push auf main; von
    # Hand nur vom main-Branch.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: test
    env:
      TESTENV_SUPABASE_URL: ${{ secrets.TESTENV_SUPABASE_URL }}
      TESTENV_SUPABASE_ANON_KEY: ${{ secrets.TESTENV_SUPABASE_ANON_KEY }}
      TESTENV_DATABASE_URL: ${{ secrets.TESTENV_DATABASE_URL }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      # Optional (Jannes, 2026-09-25: 1a und 2a).
      TESTENV_LOGIN_PASSWORD: ${{ secrets.TESTENV_LOGIN_PASSWORD }}
      TESTENV_TUER_PASSWORD: ${{ secrets.TESTENV_TUER_PASSWORD }}
    steps:
      - name: Secrets vorhanden?
        id: bereit
        run: |
          fehlend=()
          for name in TESTENV_SUPABASE_URL TESTENV_SUPABASE_ANON_KEY TESTENV_DATABASE_URL \
                      DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || fehlend+=("$name")
          done
          if [ "${#fehlend[@]}" -gt 0 ]; then
            echo "::notice::Test-Umgebung nicht eingerichtet, Auslieferung uebersprungen. Es fehlt: ${fehlend[*]}"
            echo "bereit=false" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.bereit.outputs.bereit == 'true'
        with:
          # Genau der Commit, den die CI geprueft hat - nicht der, der
          # inzwischen auf main liegt.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.bereit.outputs.bereit == 'true'

      - uses: actions/setup-node@v5
        if: steps.bereit.outputs.bereit == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.bereit.outputs.bereit == 'true'
        run: pnpm install --frozen-lockfile

      - name: Konfiguration pruefen
        # Kein service_role im Browser (ADR-015), Datenbank und Projekt-URL
        # gehoeren zusammen, nichts zeigt auf eine lokale Datenbank.
        if: steps.bereit.outputs.bereit == 'true'
        run: node scripts/testumgebung.mjs konfiguration

      - uses: supabase/setup-cli@v1
        if: steps.bereit.outputs.bereit == 'true'
        with:
          # Dieselbe feste Version wie in ci.yml.
          version: 2.116.0

      - name: Migrationen einspielen
        if: steps.bereit.outputs.bereit == 'true'
        run: supabase db push --db-url "$TESTENV_DATABASE_URL" --yes

      - name: Neu aufsetzen - Seed, Praxiswoche, Zugang
        if: steps.bereit.outputs.bereit == 'true'
        env:
          NEU_AUFSETZEN: ${{ inputs.neu_aufsetzen }}
        run: |
          organisationen=$(psql "$TESTENV_DATABASE_URL" -tAX -v ON_ERROR_STOP=1 \
            -c 'select count(*) from public.organizations')
          if [ "$NEU_AUFSETZEN" != "true" ] && [ "$organisationen" != "0" ]; then
            echo "Bestand bleibt (keine Eingabe 'neu aufsetzen')."
            exit 0
          fi
          if [ -z "$TESTENV_LOGIN_PASSWORD" ]; then
            echo "::warning::TESTENV_LOGIN_PASSWORD fehlt - alle Konten der Test-Umgebung sind gesperrt."
          fi
          # Eine Transaktion: Das Entwicklungskennwort aus seed.sql wird nie
          # festgeschrieben (ANN-100).
          psql "$TESTENV_DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 \
            -f supabase/testumgebung/neu-aufsetzen.psql > /dev/null

      - name: Build
        if: steps.bereit.outputs.bereit == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.TESTENV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TESTENV_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: SSH einrichten
        if: steps.bereit.outputs.bereit == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts
          # IPv4: Ueber IPv6 bricht die Verbindung zu Uberspace ab
          # (hosting-optionen.md, 2026-09-25). Nur der festgehaltene
          # Serverschluessel wird akzeptiert.
          echo "SSH=ssh -4 -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/deploy_known_hosts" >> "$GITHUB_ENV"

      - name: Zweite Tuer
        if: steps.bereit.outputs.bereit == 'true'
        run: |
          ziel="$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"
          if [ -z "$TESTENV_TUER_PASSWORD" ]; then
            echo "::notice::TESTENV_TUER_PASSWORD fehlt - die Seite ist ohne zweite Tuer erreichbar (Anmeldung und RLS schuetzen die Daten)."
            $SSH "$ziel" 'rm -f ~/praxis-test/tuer.htpasswd'
            exit 0
          fi
          command -v htpasswd > /dev/null || sudo apt-get install -y -qq apache2-utils > /dev/null
          # Kennwort ueber stdin, nie auf der Befehlszeile; bcrypt.
          printf '%s' "$TESTENV_TUER_PASSWORD" | htpasswd -niB praxis > tuer.htpasswd
          $SSH "$ziel" 'install -d -m 755 ~/praxis-test && cat > ~/praxis-test/tuer.htpasswd && chmod 644 ~/praxis-test/tuer.htpasswd' < tuer.htpasswd
          rm -f tuer.htpasswd
          heim=$($SSH "$ziel" 'printf %s "$HOME"')
          echo "TUER_DATEI=$heim/praxis-test/tuer.htpasswd" >> "$GITHUB_ENV"

      # ANN-101: Kopfzeilen, CSP, noindex und - mit TUER_DATEI - die zweite Tuer.
      - name: Auslieferung vorbereiten (.htaccess, robots.txt)
        if: steps.bereit.outputs.bereit == 'true'
        run: node scripts/testumgebung.mjs vorbereiten dist

      - name: Hochladen
        if: steps.bereit.outputs.bereit == 'true'
        run: |
          rsync -4 -rlz --delete --chmod=D755,F644 -e "$SSH" \
            dist/ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:www/html/"

      - name: Ausgelieferte Seite pruefen
        if: steps.bereit.outputs.bereit == 'true'
        run: node scripts/testumgebung.mjs pruefen "https://$DEPLOY_SSH_USER.uber.space"

      - name: Schluessel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/deploy_known_hosts tuer.htpasswd
