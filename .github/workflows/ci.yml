# =============================================================================
# CI nach ADR-013.
#
# Fehlgeschlagene Pflichtpruefungen blockieren den Merge. Der main-Branch wird
# zusaetzlich ueber Branch Protection geschuetzt; das ist eine
# Repository-Einstellung und kann nicht aus dem Workflow heraus gesetzt werden
# (siehe docs/DEVELOPMENT.md, "Manuelle Schritte").
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ADR-013 Punkt 2 (Fassung 5): Ein Pull Request, der nur Dokumentation
  # aendert, laesst Tests, Build und Datenbankpruefungen aus
  # (scripts/nur-doku.mjs). Format, Lint, Typecheck, Dokumentation, Secret
  # Scanning, Dependency Audit und das Migrationen-Gate laufen immer, und auf
  # main laeuft nach dem Merge alles. Die abhaengigen Jobs fragen `!= 'true'`:
  # Scheitert dieser Job und bleibt die Ausgabe leer, laeuft ebenfalls alles.
  aenderungen:
    name: Nur Dokumentation?
    runs-on: ubuntu-latest
    outputs:
      nur_doku: ${{ steps.art.outputs.nur_doku }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          # Der Vergleich braucht den gemeinsamen Vorfahren mit dem Zielbranch.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Art der Aenderung
        id: art
        env:
          EREIGNIS: ${{ github.event_name }}
          BASIS: origin/${{ github.base_ref }}
        run: |
          if [ "$EREIGNIS" != pull_request ]; then
            echo "Push auf $GITHUB_REF: alle Pruefungen laufen."
            echo "nur_doku=false" >> "$GITHUB_OUTPUT"
          # Die Erkennung in der Fassung des Zielbranchs: Ein Fehler, den der
          # Pull Request in das Skript einbaut, kann ihn nicht selbst als Doku
          # einstufen. Fehlt sie dort, laeuft alles.
          elif git show "$BASIS:scripts/nur-doku.mjs" > "$RUNNER_TEMP/nur-doku.mjs"; then
            node "$RUNNER_TEMP/nur-doku.mjs" "$BASIS" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Erkennung auf $BASIS: alle Pruefungen laufen."
            echo "nur_doku=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint, Typecheck und Tests laufen in zwei Jobs nebeneinander statt
  # hintereinander (ANN-571). Pflichtcheck bleibt `quality` weiter unten
  # unter seinem alten Namen.
  statisch:
    name: Format, Lint, Dokumentation, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Die Kommentarregel vergleicht mit dem Zielbranch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (inkl. statischer Sicherheitsanalyse)
        run: pnpm lint

      # Nur Kommentare, die der Pull Request oder Push schreibt oder aendert (docs/DEVELOPMENT.md).
      - name: Kommentarregel (hoechstens drei Zeilen, keine Tickets)
        env:
          BASIS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/kommentare-check.mjs "$BASIS"

      - name: Dokumentation (Obergrenzen, Register-Anker, Links)
        run: pnpm docs:check

      - name: Typecheck
        run: pnpm typecheck

      # Auch bei reiner Doku: Eine neue Datei darf keinen Pfad nur in der
      # Schreibweise wiederholen (scripts/nur-doku.mjs).
      - name: Dateinamen ohne Kollision der Schreibweise
        run: pnpm exec vitest run --project logik src/dateinamen.test.ts

  unit:
    name: Unit-Tests und Build
    runs-on: ubuntu-latest
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.nur_doku != 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit- und Integrationstests
        run: pnpm test

      - name: Build
        # Nur Vite: `pnpm build` ruft vorher `tsc --build --force` ueber
        # dieselben vier tsconfig-Dateien auf, die der Typecheck im Job
        # `statisch` schon prueft (ANN-571).
        run: pnpm exec vite build

  quality:
    # Der Name ist der Pflichtcheck der Branch Protection (docs/DEVELOPMENT.md,
    # "Manuelle Schritte") und bleibt deshalb unveraendert. Gruen nur, wenn
    # die statischen Pruefungen und Tests mit Build es sind - Tests und Build
    # duerfen nur bei reiner Dokumentation fehlen.
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    needs: [aenderungen, statisch, unit]
    if: ${{ always() }}
    steps:
      - name: Statische Pruefungen, Tests und Build gruen
        env:
          NUR_DOKU: ${{ needs.aenderungen.outputs.nur_doku }}
          STATISCH: ${{ needs.statisch.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "Nur Dokumentation: ${NUR_DOKU:-unbekannt}, statisch: $STATISCH, Tests und Build: $UNIT"
          test "$STATISCH" = success
          test "$UNIT" = success || { test "$NUR_DOKU" = true && test "$UNIT" = skipped; }

  # Die Datenbanktests laufen in vier Teilen nebeneinander, jeder Teil mit
  # eigener Datenbank. In einem Stueck brauchten sie zuletzt 13 bis 20 Minuten
  # und bestimmten damit die Dauer jedes Laufs (2026-10-10). Vitest teilt die
  # Dateien nach `--shard` ohne Ueberschneidung auf; zusammen laufen alle.
  # Pflichtcheck bleibt der Job `database` weiter unten unter seinem alten
  # Namen - er ist nur gruen, wenn alle Teile und das Migrationen-Gate es sind.
  database-teil:
    name: Migrationen und RLS-Tests (Teil ${{ matrix.teil }}/4)
    runs-on: ubuntu-latest
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.nur_doku != 'true' }}
    strategy:
      # Ein roter Teil bricht die anderen nicht ab: Der Lauf soll alle Befunde
      # auf einmal zeigen, nicht einen je Durchgang.
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]
    # Die Berechtigungstests aus ADR-013 laufen gegen eine echte PostgreSQL-
    # Instanz. Ein Mock waere hier wertlos: geprueft wird die Policy selbst.
    services:
      postgres:
        # Dasselbe offizielle Image, über den Spiegel von Google statt direkt
        # von Docker Hub: Dort scheiterte der Job am Abruflimit für anonyme
        # Abrufe, bevor ein Test lief (PR #208, 2026-10-09). Zurück auf Docker
        # Hub: `postgres:16`.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrationen und RLS-Tests
        run: pnpm test:db --shard=${{ matrix.teil }}/4

  migrationen:
    name: Ausgelieferte Migrationen unveraendert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Die ganze Geschichte: Das Migrationen-Gate vergleicht mit main.
          fetch-depth: 0

      # Das Gate braucht nur Node und git, kein pnpm. Ohne diese Zeile sucht
      # setup-node wegen `packageManager` in package.json nach pnpm und bricht
      # ab, bevor das Gate laeuft.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # BEF-123: Eine Migration, die schon auf main liegt, ist in der
      # Test-Umgebung eingespielt und wird dort nie wieder ausgefuehrt. Wer sie
      # aendert, aendert nur das Repository. Im Pull Request prueft die CI den
      # Merge mit dem aktuellen main, auf main den Push gegen den Stand davor.
      - name: Ausgelieferte Migrationen unveraendert
        env:
          BASIS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/migrationen-check.mjs "$BASIS"

  database:
    # Der Name ist der Pflichtcheck der Branch Protection (docs/DEVELOPMENT.md,
    # "Manuelle Schritte") und bleibt deshalb unveraendert. `always()` laesst
    # den Job auch laufen, wenn ein Teil rot oder abgebrochen ist - sonst
    # stuende er als "uebersprungen" da, und ein uebersprungener Pflichtcheck
    # zaehlt als bestanden. Das gilt fuer alle drei Sammeljobs: Ein von Hand
    # abgebrochener Lauf darf keinen Pflichtcheck gruen hinterlassen.
    name: Migrationen und RLS-Policies
    runs-on: ubuntu-latest
    #
    # Bei reiner Dokumentation laufen die Teile nicht; das Migrationen-Gate
    # laeuft immer.
    needs: [aenderungen, database-teil, migrationen]
    if: ${{ always() }}
    steps:
      - name: Alle Teile und das Migrationen-Gate gruen
        env:
          NUR_DOKU: ${{ needs.aenderungen.outputs.nur_doku }}
          TEILE: ${{ needs.database-teil.result }}
          MIGRATIONEN: ${{ needs.migrationen.result }}
        run: |
          echo "Nur Dokumentation: ${NUR_DOKU:-unbekannt}, Datenbanktests: $TEILE, Migrationen-Gate: $MIGRATIONEN"
          test "$MIGRATIONEN" = success
          test "$TEILE" = success || { test "$NUR_DOKU" = true && test "$TEILE" = skipped; }

  security:
    name: Secret Scanning und Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret Scanning
        run: pnpm scan:secrets

      - name: Dependency Audit
        # ANN-054: blockierend ab Schweregrad `high`; `low` und `moderate`
        # werden berichtet, nicht blockiert. ADR-013 verlangt den Scan, legt die
        # Schwelle aber nicht fest.
        run: pnpm audit --audit-level=high

  e2e:
    # Bei reiner Dokumentation uebersprungen; ein uebersprungener Job zaehlt
    # fuer die Branch Protection als bestanden.
    name: End-to-End
    runs-on: ubuntu-latest
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.nur_doku != 'true' }}
    # Der Vite-Dev-Server bricht ohne diese Variablen beim Start der Anwendung
    # ab (src/lib/env.ts). Es sind bewusst Platzhalter ohne jeden Wert: die
    # E2E-Abdeckung prueft ausschliesslich den nicht angemeldeten Zustand, es
    # wird keine Supabase-Instanz kontaktiert. Keine Secrets (PROJECT_PRINCIPLES.md 3.3).
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: platzhalter-ohne-funktion
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End-Tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Prueft den echten Integrationspfad: Browser -> GoTrue -> PostgREST ->
  # SECURITY-DEFINER-RPC -> PostgreSQL. Jeder Teil startet dafuer denselben
  # lokalen Supabase-Stack, den auch die Entwicklung benutzt. Es entsteht
  # keine Cloudressource und es wird kein Projekt kontaktiert (ADR-015).
  #
  # Die Tests aendern Daten und laufen deshalb mit einem Worker. In einem
  # Stueck brauchten sie zuletzt 16 Minuten und bestimmten die Dauer jedes
  # Laufs (2026-10-16). Jetzt laufen drei Teile nebeneinander, jeder mit
  # eigenem Stack aus Migrationen und Seed (ANN-571). Playwright teilt das
  # Projekt `authenticated` dateiweise auf, weil es nicht `fullyParallel`
  # ist; die seriellen Bloecke einer Datei bleiben zusammen. Pflichtcheck
  # bleibt `e2e-supabase` weiter unten unter seinem alten Namen.
  e2e-supabase-teil:
    name: End-to-End hinter der Anmeldung (Teil ${{ matrix.teil }}/3)
    runs-on: ubuntu-latest
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.nur_doku != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      # Feste Version statt `latest`. `latest` laesst die Action bei jedem Lauf
      # die GitHub-API nach dem neuesten Release fragen - ein Aufruf ohne Token,
      # der am 2026-09-05 auf `main` ins Rate Limit lief ("Failed to resolve
      # latest Supabase CLI release: rate limit exceeded"). Der Job starb nach
      # 37 Sekunden, bevor ein einziger Test lief, und riss den ganzen Lauf mit.
      #
      # Eine feste Version macht das Gate ausserdem reproduzierbar (ADR-013):
      # derselbe Commit wird nicht davon abhaengig, was an dem Tag gerade
      # veroeffentlicht ist. Sie ist bewusst von Hand zu erhoehen.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Supabase starten
        # Die Ports des Stacks liegen im Bereich der Absenderports von Linux. Belegt eine andere
        # Verbindung gerade einen davon, scheitert der Start (Port 54324, 2026-10-25); reserviert nie.
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start

      - name: Migrationen und synthetischen Seed anwenden
        # Ausdruecklich statt implizit: der Stand ist damit nachweislich aus
        # Migrationen + Seed reproduziert und nicht aus einem Zwischenzustand.
        run: supabase db reset

      - name: Verbindungswerte der Wegwerf-Instanz uebernehmen
        # Die Werte gelten nur fuer diesen Lauf. Der anon key ist ein
        # oeffentlicher Clientwert, wird aber trotzdem maskiert - Schluessel
        # gehoeren nicht in Logs (ADR-011).
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: End-to-End-Tests mit echter Anmeldung
        # Nur das Projekt hinter der Anmeldung: den nicht angemeldeten Zustand
        # deckt der Job "End-to-End" ab, der ohne Docker auskommt. So laeuft
        # jeder Test einmal statt zweimal.
        run: pnpm test:e2e --project authenticated --shard=${{ matrix.teil }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-supabase-teil-${{ matrix.teil }}
          path: playwright-report/
          retention-days: 7

      - name: Supabase stoppen
        if: always()
        run: supabase stop --no-backup

  e2e-supabase:
    # Der Name ist der Pflichtcheck der Branch Protection und bleibt. Gruen
    # nur, wenn alle Teile es sind - oder bei reiner Dokumentation keiner lief.
    name: End-to-End hinter der Anmeldung
    runs-on: ubuntu-latest
    needs: [aenderungen, e2e-supabase-teil]
    if: ${{ always() }}
    steps:
      - name: Alle Teile gruen
        env:
          NUR_DOKU: ${{ needs.aenderungen.outputs.nur_doku }}
          TEILE: ${{ needs.e2e-supabase-teil.result }}
        run: |
          echo "Nur Dokumentation: ${NUR_DOKU:-unbekannt}, Teile: $TEILE"
          test "$TEILE" = success || { test "$NUR_DOKU" = true && test "$TEILE" = skipped; }
